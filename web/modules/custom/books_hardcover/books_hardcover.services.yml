services:
  books_hardcover.client:
    class: Drupal\books_hardcover\Services\HardcoverService
    arguments:
      - '@http_client'
      - '@logger.factory'
      - '@settings'
      - '@isbn.isbn_service'
      - '@datetime.time'
  books_hardcover.sync:
    class: Drupal\books_hardcover\Services\BookSyncService
    arguments:
      - '@entity_type.manager'
      - '@queue'
  books_hardcover.activity_sync:
    class: Drupal\books_hardcover\Services\ActivitySyncService
    arguments:
      - '@books_hardcover.client'
      - '@entity_type.manager'
      - '@books_activity.status'
      - '@books_catalog.books'
      - '@books_hardcover.sync'
      - '@lock'
      - '@logger.factory'
