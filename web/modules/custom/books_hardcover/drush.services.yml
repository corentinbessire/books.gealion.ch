services:
  books_hardcover.commands:
    class: \Drupal\books_hardcover\Commands\BooksHardcoverCommands
    tags:
      - { name: drush.command }
    arguments:
      - '@books_hardcover.sync'
      - '@books_catalog.books'
      - '@queue'
      - '@plugin.manager.queue_worker'
  books_hardcover.activity_commands:
    class: \Drupal\books_hardcover\Commands\ActivitySyncCommands
    tags:
      - { name: drush.command }
    arguments:
      - '@books_hardcover.activity_sync'
