services:
  books.hardcover:
    class: Drupal\books_book_managment\Services\HardcoverService
    arguments:
      - '@http_client'
      - '@logger.factory'
      - '@settings'
      - '@isbn.isbn_service'
      - '@datetime.time'
  books.books_utils:
    class: Drupal\books_book_managment\Services\BooksUtilsService
    arguments:
      - '@logger.factory'
      - '@entity_type.manager'
      - '@queue'
  books.cover_download:
    class: Drupal\books_book_managment\Services\CoverDownloadService
    arguments:
      - '@http_client'
      - '@logger.factory'
      - '@entity_type.manager'
      - '@file.repository'
