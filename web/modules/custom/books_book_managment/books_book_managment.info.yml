name: 'Books - Book Management (retiring)'
type: module
description: 'Empty shell kept only so the update-hook history survives. Its code now lives in books_catalog, books_cover and books_hardcover. It declares no services deliberately: a service alias here would point at a module that is not yet installed during a deploy, and the container rebuild that runs before config:import would fail. Safe to uninstall once every environment is past update 11001.'
package: Books
core_version_requirement: ^10 || ^11
dependencies:
  - books_catalog:books_catalog
  - books_cover:books_cover
  - books_hardcover:books_hardcover
